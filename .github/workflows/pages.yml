name: Pubblica su GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Test e compilazione del motore (Kotlin → JavaScript)
        run: ./gradlew :engine:jvmTest :engine:jsBrowserProductionLibraryDistribution --no-daemon

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Web app
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Pacchetto per l'uso in locale (DocVerso.bat)
        working-directory: web
        run: npm run pacchetto

      - uses: actions/upload-artifact@v4
        with:
          name: DocVerso-locale
          path: web/DocVerso-locale.zip

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    continue-on-error: true # finché GitHub Pages non è attivo resta solo il pacchetto locale
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
